name: Validate PR

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/pr-validate.yml'

permissions:
  contents: read

env:
  UV_HTTP_RETRIES: "5"
  UV_HTTP_TIMEOUT: "60"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v6
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: uv sync --no-install-project
    - name: Fetch base branch
      shell: bash
      run: |
        for delay in 10 30; do
          if git fetch --depth=1 origin "$GITHUB_BASE_REF"; then
            exit 0
          fi
          sleep "$delay"
        done
        git fetch --depth=1 origin "$GITHUB_BASE_REF"
    - name: Validate added README entries
      run: uv run python scripts/validate_readme.py --diff-from origin/${{ github.base_ref }}
    - name: Generate static site
      run: uv run python site/generate.py

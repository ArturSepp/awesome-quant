name: Validate PR

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/pr-validate.yml'

permissions:
  contents: read

env:
  UV_HTTP_RETRIES: "5"
  UV_HTTP_TIMEOUT: "60"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; Node 24
      with:
        version: '0.12.23'
        python-version: '3.11'
    - name: Install dependencies
      run: uv sync --locked --no-install-project
    - name: Validate added README entries
      if: github.event_name == 'pull_request'
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git cat-file -e "${PR_BASE_SHA}^{commit}"
        uv run --no-sync python scripts/validate_readme.py --diff-from "$PR_BASE_SHA"
    - name: Validate full README on manual runs
      if: github.event_name == 'workflow_dispatch'
      run: uv run --no-sync python scripts/validate_readme.py
    - name: Generate static site from README
      run: |
        if [ -f site/projects.csv ]; then
          mv site/projects.csv "$RUNNER_TEMP/pr-projects.csv"
        fi
        uv run --no-sync python site/generate.py
